name: A1FS V1.1 M01 Unit01 Cross-Skill Vertical Slice

on:
  pull_request:
    branches: [main]
    paths:
      - "ulga/builders/build_a1fs_v1_1_m01_unit01_cross_skill_vertical_slice.py"
      - "ulga/validators/validate_a1fs_v1_1_m01_unit01_cross_skill_vertical_slice.py"
      - "tests/ulga/test_a1fs_v1_1_m01_unit01_cross_skill_vertical_slice.py"
      - ".github/workflows/a1fs-v1-1-m01-unit01-cross-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit01-cross-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install pytest jsonschema
      - name: Compile implementation
        run: |
          python -m py_compile \
            ulga/builders/build_a1fs_v1_1_m01_unit01_cross_skill_vertical_slice.py \
            ulga/validators/validate_a1fs_v1_1_m01_unit01_cross_skill_vertical_slice.py \
            tests/ulga/test_a1fs_v1_1_m01_unit01_cross_skill_vertical_slice.py
      - name: Run Unit01 focused acceptance
        run: |
          python -m pytest -q \
            --junitxml=unit01-junit.xml \
            tests/ulga/test_a1fs_v1_1_m01_unit01_cross_skill_vertical_slice.py
      - name: Preserve focused test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1fs-v1-1-m01-unit01-junit
          path: unit01-junit.xml
          if-no-files-found: error
          retention-days: 7
      - name: Run canonical content governance
        run: |
          python ulga/validators/validate_a1fs_v1_canonical_content_production_policy.py
          python -m pytest -q tests/ulga/test_a1fs_v1_canonical_content_production_policy.py
      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"
