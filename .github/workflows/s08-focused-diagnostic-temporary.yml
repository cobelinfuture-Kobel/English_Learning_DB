name: S08 Focused Diagnostic Temporary

on:
  pull_request:
    branches: [main]
    paths:
      - "ulga/builders/build_a1fs_online_v1_s08_private_multiunit_learner_journey_qa.py"
      - "ulga/validators/validate_a1fs_online_v1_s08_private_multiunit_learner_journey_qa.py"
      - "tests/ci/test_a1fs_online_v1_s08_private_multiunit_learner_journey_qa.py"
      - "ulga/artifacts/manifests/a1fs_online_v1_s02_artifact_manifest.json"
      - ".github/workflows/s08-focused-diagnostic-temporary.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest jsonschema
      - name: Run focused S08 pytest
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -x -vv tests/ci/test_a1fs_online_v1_s08_private_multiunit_learner_journey_qa.py 2>&1 | tee s08-focused-pytest.log
      - name: Upload focused diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s08-focused-pytest-diagnostic
          path: s08-focused-pytest.log
          if-no-files-found: error
      - name: Enforce focused result
        if: steps.focused.outcome == 'failure'
        run: exit 1
