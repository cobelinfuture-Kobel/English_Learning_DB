name: A1FS Unit04 Q10R2R1 Actual PDFs

on:
  push:
    branches:
      - ops/a1fs-v1-u04q10r2r1-actual-pdf

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout merged-main-derived ops branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest jsonschema

      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium-family browser found" >&2
            exit 1
          fi
          echo "path=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Materialize Unit04 Form01-20 actual PDFs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python product/a1fs_v1_2_1/u04q10r2_unit04_learner_pdf_materialization_and_visual_acceptance.py \
            --output-root "$RUNNER_TEMP/unit04_actual_pdfs" \
            --chromium "${{ steps.chromium.outputs.path }}"

      - name: Verify actual PDF denominator and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("${{ runner.temp }}") / "unit04_actual_pdfs"
          manifest = json.loads((root / "unit04_form01_20_pdf_materialization_manifest.private.json").read_text(encoding="utf-8"))
          pdfs = sorted((root / "pdf").glob("Form*.pdf"))
          htmls = sorted((root / "html").glob("Form*.html"))
          assert manifest["validation_status"].startswith("PASS_")
          assert manifest["form_count"] == 20
          assert manifest["materialized_pdf_count"] == 20
          assert manifest["materialized_html_count"] == 20
          assert manifest["materialized_activity_count"] == 800
          assert len(pdfs) == 20
          assert len(htmls) == 20
          assert all(p.stat().st_size >= 1024 for p in pdfs)
          print("ACTUAL_PDF_COUNT=20")
          print("ACTUAL_HTML_COUNT=20")
          print("ACTUAL_ACTIVITY_COUNT=800")
          print("ACTUAL_PDF_MACHINE_ACCEPTANCE=PASS")
          PY

      - name: Upload Unit04 actual learner PDFs
        uses: actions/upload-artifact@v4
        with:
          name: unit04-form01-20-actual-pdfs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/unit04_actual_pdfs/pdf/*.pdf
            ${{ runner.temp }}/unit04_actual_pdfs/html/*.html
            ${{ runner.temp }}/unit04_actual_pdfs/unit04_form01_20_pdf_materialization_manifest.private.json
          if-no-files-found: error
          retention-days: 7
