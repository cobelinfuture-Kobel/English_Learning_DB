name: English DB CI Readback

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Classify changed-path impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed_paths.txt"
          : > "$changed"

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            if [ -n "${BASE_SHA:-}" ] && ! printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed"
            else
              git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > "$changed"
            fi
          fi

          echo "CI_CHANGED_PATHS_BEGIN"
          cat "$changed"
          echo "CI_CHANGED_PATHS_END"

          python ulga/validators/validate_pr_workflow_fanout.py \
            --classify-paths-file "$changed" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install dependencies for test-bearing routes
        if: steps.impact.outputs.impact_scope != 'STORAGE_ONLY' && steps.impact.outputs.impact_scope != 'DOCS_ONLY'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest jsonschema

      - name: Validate PR workflow fan-out governance
        if: steps.impact.outputs.impact_scope == 'CI_GOVERNANCE' || steps.impact.outputs.impact_scope == 'FULL'
        run: python ulga/validators/validate_pr_workflow_fanout.py

      - name: Check required governance files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "AGENTS.md",
              "docs/governance/PROJECT_TASK_EXPANSION_CONTROL_POLICY.md",
              "docs/governance/ENGLISH_GRAMMAR_PROJECT_GOVERNANCE.md",
              "docs/ulga/E4S_CI_READBACK_GATE_POLICY.md",
              "docs/ulga/E4S_CI_TEST_SURFACE_INVENTORY.md",
              "docs/ulga/E4S_CI_WORKFLOW_CONTRACT.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              print("CI_GOVERNANCE_FILES_STATUS=FAIL")
              for path in missing:
                  print(f"MISSING_REQUIRED_FILE={path}")
              raise SystemExit(1)
          print("CI_GOVERNANCE_FILES_STATUS=PASS")
          print(f"CI_GOVERNANCE_FILES_CHECKED={len(required)}")
          PY

      - name: Check Markdown UTF-8 readability
        if: steps.impact.outputs.impact_scope == 'DOCS_ONLY' || steps.impact.outputs.impact_scope == 'CI_GOVERNANCE' || steps.impact.outputs.impact_scope == 'FULL'
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path("AGENTS.md"), Path("README.md"), Path("docs")]
          checked = 0
          failed = []
          for root in roots:
              candidates = [root] if root.is_file() else list(root.rglob("*.md")) if root.is_dir() else []
              for path in candidates:
                  try:
                      path.read_text(encoding="utf-8")
                      checked += 1
                  except Exception as exc:
                      failed.append((str(path), str(exc)))
          print(f"CI_MARKDOWN_UTF8_CHECKED={checked}")
          print(f"CI_MARKDOWN_UTF8_FAILED={len(failed)}")
          if failed:
              print("CI_MARKDOWN_UTF8_STATUS=FAIL")
              for path, error in failed[:50]:
                  print(f"MARKDOWN_UTF8_FAIL={path}: {error}")
              raise SystemExit(1)
          print("CI_MARKDOWN_UTF8_STATUS=PASS")
          PY

      - name: Check storage evidence integrity
        if: steps.impact.outputs.impact_scope == 'STORAGE_ONLY'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          changed = Path(os.environ["RUNNER_TEMP"]) / "changed_paths.txt"
          checked = 0
          for raw in changed.read_text(encoding="utf-8").splitlines():
              path = Path(raw)
              if not path.is_file():
                  continue
              if path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              elif path.suffix == ".jsonl":
                  for line in path.read_text(encoding="utf-8").splitlines():
                      if line.strip():
                          json.loads(line)
              else:
                  if path.stat().st_size == 0:
                      raise SystemExit(f"EMPTY_STORAGE_ARTIFACT={path}")
              checked += 1
          print("CI_ROUTE=STORAGE_ONLY")
          print(f"CI_STORAGE_ARTIFACTS_CHECKED={checked}")
          print("CI_PYTEST_STATUS=SKIPPED_STORAGE_ONLY")
          PY

      - name: Check full-scope JSON integrity
        if: steps.impact.outputs.impact_scope == 'FULL'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [Path("ulga"), Path("raz_output_jsons"), Path("docs")]
          checked = 0
          failed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*.json"):
                  try:
                      json.loads(path.read_text(encoding="utf-8"))
                      checked += 1
                  except Exception as exc:
                      failed.append((str(path), str(exc)))
          print(f"CI_JSON_CHECKED={checked}")
          print(f"CI_JSON_FAILED={len(failed)}")
          if failed:
              for path, error in failed[:50]:
                  print(f"JSON_FAIL={path}: {error}")
              raise SystemExit(1)
          print("CI_JSON_STATUS=PASS")
          PY

      - name: Run impact-scoped pytest
        if: steps.impact.outputs.impact_scope != 'STORAGE_ONLY' && steps.impact.outputs.impact_scope != 'DOCS_ONLY'
        env:
          IMPACT_SCOPE: ${{ steps.impact.outputs.impact_scope }}
        run: |
          set -euo pipefail
          echo "CI_PYTHONPATH=$PYTHONPATH"

          case "$IMPACT_SCOPE" in
            CI_GOVERNANCE)
              echo "CI_ROUTE=CI_GOVERNANCE"
              python -m pytest -q tests/ci/test_pr_workflow_fanout.py
              ;;
            KET_FOCUSED)
              echo "CI_ROUTE=KET_FOCUSED"
              mapfile -t targets < <(find tests/ci -maxdepth 1 -type f -name 'test_ket_data_*.py' | sort)
              if [ "${#targets[@]}" -eq 0 ]; then
                echo "CI_FOCUSED_TARGETS=0"
                exit 1
              fi
              python -m pytest -q "${targets[@]}" --durations=30
              ;;
            UNIT*)
              unit="${IMPACT_SCOPE#UNIT}"
              echo "CI_ROUTE=UNIT_FOCUSED"
              mapfile -t targets < <(find tests/ci -maxdepth 1 -type f \( -iname "*u${unit}*.py" -o -iname "*unit${unit}*.py" \) | sort -u)
              if [ "${#targets[@]}" -eq 0 ]; then
                echo "CI_UNIT_FOCUSED_TARGETS=0; FALLBACK=FULL"
                echo "CI_ROUTE=FULL"
                python -m pytest -q tests/ci --durations=30
              else
                printf 'CI_UNIT_FOCUSED_TARGET=%s\n' "${targets[@]}"
                python -m pytest -q "${targets[@]}" --durations=30
              fi
              ;;
            FULL)
              echo "CI_ROUTE=FULL"
              python -m pytest -q tests/ci --durations=30
              ;;
            *)
              echo "UNKNOWN_IMPACT_SCOPE=$IMPACT_SCOPE"
              exit 1
              ;;
          esac
          echo "CI_PYTEST_STATUS=PASS"

      - name: Docs-only readback
        if: steps.impact.outputs.impact_scope == 'DOCS_ONLY'
        run: |
          echo "CI_ROUTE=DOCS_ONLY"
          echo "CI_PYTEST_STATUS=SKIPPED_DOCS_ONLY"

      - name: Discover validators
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(str(path) for path in Path("ulga/validators").rglob("*.py")) if Path("ulga/validators").is_dir() else []
          print("CI_VALIDATOR_DISCOVERY_STATUS=PASS" if files else "CI_VALIDATOR_DISCOVERY_STATUS=SKIPPED_NO_VALIDATOR_DIR")
          print(f"CI_VALIDATOR_FILES={len(files)}")
          PY

      - name: Discover builders
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(str(path) for path in Path("ulga/builders").rglob("*.py")) if Path("ulga/builders").is_dir() else []
          print("CI_BUILDER_DISCOVERY_STATUS=PASS" if files else "CI_BUILDER_DISCOVERY_STATUS=SKIPPED_NO_BUILDER_DIR")
          print(f"CI_BUILDER_FILES={len(files)}")
          PY

      - name: Final CI summary
        env:
          IMPACT_SCOPE: ${{ steps.impact.outputs.impact_scope }}
          IMPACT_REASON: ${{ steps.impact.outputs.impact_reason }}
          CHANGED_PATH_COUNT: ${{ steps.impact.outputs.changed_path_count }}
        run: |
          echo "CI_WORKFLOW=English DB CI Readback"
          echo "CI_IMPACT_SCOPE=$IMPACT_SCOPE"
          echo "CI_IMPACT_REASON=$IMPACT_REASON"
          echo "CI_CHANGED_PATH_COUNT=$CHANGED_PATH_COUNT"
          echo "CI_EXIT_CODE=0"

      - name: Publish commit status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'English DB CI Readback passed' || 'English DB CI Readback failed' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "state": os.environ["STATE"],
              "target_url": os.environ["TARGET_URL"],
              "description": os.environ["DESCRIPTION"][:140],
              "context": "English DB CI Readback",
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print("COMMIT_STATUS_REPORTER_STATUS=PASS")
              print("COMMIT_STATUS_REPORTER_HTTP_STATUS=" + str(response.status))
          PY
