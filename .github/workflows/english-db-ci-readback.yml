name: English DB CI Readback

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest jsonschema

      - name: Validate PR workflow fan-out governance
        run: python ulga/validators/validate_pr_workflow_fanout.py

      - name: Check required governance files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "AGENTS.md",
              "docs/governance/PROJECT_TASK_EXPANSION_CONTROL_POLICY.md",
              "docs/governance/ENGLISH_GRAMMAR_PROJECT_GOVERNANCE.md",
              "docs/ulga/E4S_CI_READBACK_GATE_POLICY.md",
              "docs/ulga/E4S_CI_TEST_SURFACE_INVENTORY.md",
              "docs/ulga/E4S_CI_WORKFLOW_CONTRACT.md",
          ]

          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              print("CI_GOVERNANCE_FILES_STATUS=FAIL")
              for path in missing:
                  print(f"MISSING_REQUIRED_FILE={path}")
              raise SystemExit(1)

          print("CI_GOVERNANCE_FILES_STATUS=PASS")
          print(f"CI_GOVERNANCE_FILES_CHECKED={len(required)}")
          PY

      - name: Check Markdown UTF-8 readability
        run: |
          python - <<'PY'
          from pathlib import import Path
          PY
