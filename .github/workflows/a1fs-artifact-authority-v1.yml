name: A1FS Artifact Authority V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1fs-artifact-authority-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/ci/test_a1fs_artifact_authority_v1_s00.py -q
      - name: Manifest and runner compile gate
        run: |
          python -m py_compile \
            ulga/artifacts/a1fs_artifact_authority.py \
            ulga/runners/materialize_a1fs_online_v1.py
          python -m json.tool \
            ulga/artifacts/manifests/a1fs_online_v1_s02_artifact_manifest.json \
            >/dev/null
