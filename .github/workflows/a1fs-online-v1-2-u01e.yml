name: A1FS Online V1.2 U01E

on:
  pull_request:
    branches: [main]
    paths:
      - "ulga/builders/build_a1fs_online_v1_2_u01e_*.py"
      - "ulga/validators/validate_a1fs_online_v1_2_u01e_*.py"
      - "tests/ulga/test_a1fs_online_v1_2_u01e_*.py"
      - ".github/workflows/a1fs-online-v1-2-u01e.yml"
  push:
    branches: [main]
    paths:
      - "ulga/builders/build_a1fs_online_v1_2_u01e_*.py"
      - "ulga/validators/validate_a1fs_online_v1_2_u01e_*.py"
      - "tests/ulga/test_a1fs_online_v1_2_u01e_*.py"
      - ".github/workflows/a1fs-online-v1-2-u01e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  u01e-focused-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install pytest openpyxl
      - name: Compile U01E contracts
        run: |
          python -m py_compile \
            ulga/builders/build_a1fs_online_v1_2_u01e_s00_multistandard_denominator_and_lineage.py \
            ulga/validators/validate_a1fs_online_v1_2_u01e_s00_multistandard_denominator_and_lineage.py \
            tests/ulga/test_a1fs_online_v1_2_u01e_s00_multistandard_denominator_and_lineage.py
      - name: Run S00 focused acceptance
        run: |
          python -m pytest -q \
            --junitxml=/tmp/a1fs-online-v1-2-u01e-s00-junit.xml \
            tests/ulga/test_a1fs_online_v1_2_u01e_s00_multistandard_denominator_and_lineage.py
      - name: Preserve S00 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1fs-online-v1-2-u01e-s00-junit
          path: /tmp/a1fs-online-v1-2-u01e-s00-junit.xml
          if-no-files-found: error
          retention-days: 7
