name: A1FS V1 Unit04 Material Package

on:
  pull_request:
    paths:
      - 'product/a1fs_v1_2_1/u04material01_unit04_material_package.py'
      - 'tests/ci/test_a1fs_v1_u04material01_unit04_material_package_ci.py'
      - '.github/workflows/u04material01.yml'
  push:
    branches: [main]
    paths:
      - 'product/a1fs_v1_2_1/u04material01_unit04_material_package.py'
      - 'tests/ci/test_a1fs_v1_u04material01_unit04_material_package_ci.py'
      - '.github/workflows/u04material01.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Focused Unit04 material package validation
        run: python -m pytest -q tests/ci/test_a1fs_v1_u04material01_unit04_material_package_ci.py
      - name: Materialize package artifact
        run: python -m product.a1fs_v1_2_1.u04material01_unit04_material_package
      - name: Upload Unit04 material package
        uses: actions/upload-artifact@v4
        with:
          name: Unit04_Material_Package
          path: |
            build/unit04_material_package/Unit04_Material_Package.zip
            build/unit04_material_package/Unit04_Material_Package.zip.sha256
          if-no-files-found: error
